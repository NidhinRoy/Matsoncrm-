<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PackPro CRM</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#1b2438;--mu:#66728a;--bd:#e1e6ef;--ac:#2563eb;--acx:#fff;--side:#15203a;--sidetx:#b8c3dc;--red:#d92d4b;--amb:#b7791f;--grn:#1a8a55;--vio:#7c3aed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172036;--tx:#e8edf8;--mu:#93a0ba;--bd:#26324d;--ac:#6ea0ff;--acx:#0b1530;--side:#0a1020;--red:#ff6b86;--amb:#f6c453;--grn:#4ade9a;--vio:#b197fc}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172036;--tx:#e8edf8;--mu:#93a0ba;--bd:#26324d;--ac:#6ea0ff;--acx:#0b1530;--side:#0a1020;--red:#ff6b86;--amb:#f6c453;--grn:#4ade9a;--vio:#b197fc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sidetx);padding:18px 12px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:0 8px 18px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--ac);color:var(--acx);display:grid;place-items:center;font-style:normal;font-size:13px}
aside button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 12px;margin-bottom:4px;border:0;border-radius:8px;background:transparent;color:inherit;font:600 15px inherit;text-align:left}
aside button.on{background:rgba(255,255,255,.12);color:#fff}
aside em{font-style:normal;background:var(--red);color:#fff;border-radius:99px;padding:0 7px;font-size:12px;line-height:19px}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--bd)}
.top h1{font-size:20px;margin:0}.top input{width:min(240px,45%)}
main{padding:20px 24px 40px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;border-top:4px solid var(--c)}
.st b{display:block;font-size:26px;line-height:1.15}.st span{color:var(--mu);font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.bar div{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar div i{display:block;height:100%;background:var(--ac)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:680px}
th{text-align:left;font-size:13px;color:var(--mu);padding:10px;border-bottom:1px solid var(--bd);font-weight:600}
td{padding:10px;border-bottom:1px solid var(--bd);vertical-align:middle}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.WhatsApp{--c:var(--grn)}.Instagram{--c:var(--vio)}.Facebook{--c:var(--ac)}.Phone,.Walk-in{--c:var(--mu)}.late{--c:var(--red)}.ok{--c:var(--grn)}
.s-New{--c:var(--amb)}.s-Contacted,.s-Sent{--c:var(--ac)}.s-Quoted{--c:var(--vio)}.s-Won,.s-Accepted{--c:var(--grn)}.s-Lost,.s-Rejected{--c:var(--red)}.s-Draft{--c:var(--mu)}
select.s{border-color:var(--c);color:var(--c);font-weight:700}
button.a{padding:9px 14px;font:600 14px inherit;border:0;border-radius:8px;background:var(--ac);color:var(--acx)}
button.g{padding:8px 12px;font:600 13px inherit;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--tx)}
input,select{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);max-width:100%}
td input{width:96px}
details{margin-bottom:12px}summary{font-weight:600;padding:11px 14px;background:var(--card);border:1px dashed var(--ac);color:var(--ac);border-radius:10px;cursor:pointer}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;padding:12px 0}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px}
.col{flex:0 0 265px;background:color-mix(in srgb,var(--bd) 45%,transparent);border-radius:12px;padding:8px}
.col h3{font-size:13px;margin:4px 6px 8px;display:flex;justify-content:space-between}
.job{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;font-size:14px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.row input{width:112px}.note{border-left:3px solid var(--ac);padding-left:8px;margin:5px 0;font-size:13px}
.rem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.red{color:var(--red);font-weight:700}
textarea{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
a.a,a.g{padding:9px 14px;font:600 14px inherit;border-radius:8px;text-decoration:none;display:inline-block}a.a{background:var(--ac);color:var(--acx)}a.g{border:1px solid var(--bd);color:var(--tx)}
button.g.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--red);color:#fff;padding:10px 16px;border-radius:10px;z-index:20;display:none;max-width:90%}
@media(max-width:800px){
 .app{display:block}
 aside{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;z-index:9;display:flex;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}
 .logo{display:none}aside button{flex:1;justify-content:center;gap:3px;margin:0;padding:11px 2px;font-size:12px}
 .top{padding:12px 16px}main{padding:16px 16px 100px}
 .stats{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
</style></head><body>
<div id="toast"></div>
<div class="app">
<aside><div class="logo"><i>PP</i>PackPro CRM</div><div id="nav" style="display:contents"></div></aside>
<div><div class="top"><h1 id="ttl"></h1><input id="q" type="search" placeholder="Search name" oninput="draw(1)"></div><div id="pl"></div><main id="v"><p class="mu">Loading…</p></main></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const P=["Wedding Card Packaging","Commercial Printing","Monocartons","Rigid Boxes","Microflutes"];
const S=["New Inquiry","Quote Sent","Approved","Printing","Ready","Delivered"];
const SRC=["WhatsApp","Instagram","Facebook","Phone call","Walk-in"];
const IS=["New","Contacted","Quoted","Won","Lost"],QS=["Draft","Sent","Accepted","Rejected"];
const N=["customers","inquiries","quotes","jobs","reminders","players"];
const T={home:"Home",inq:"Inquiries",quo:"Quotes",jobs:"Jobs",cus:"Clients",rem:"Tasks",play:"Play"};
const C={};N.forEach(n=>C[n]=[]);
let db=null,tab="home",pend=0,ready=0;
const iso=t=>new Date(t-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"₹"+Number(n||0).toLocaleString("en-IN");
const fd=s=>new Date(s).toLocaleString([],{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const opt=(a,v)=>a.map(x=>`<option${x==v?" selected":""}>${x}</option>`).join("");
const sel=(a,v,n,id,k)=>`<select class="s s-${v}" onchange="U('${n}','${id}',{${k}:this.value})">${opt(a,v)}</select>`;
const cl=s=>String(s).split(" ")[0];
const toast=m=>{const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",4000)};
const fail=()=>toast("Could not save. Ask the page owner to give you Contributor access.");
const A=async(n,o)=>{try{return await db.collection(n).add({at:Date.now(),...o})}catch(e){fail()}};
const U=async(n,id,o)=>{try{await db.collection(n).doc(id).update(o)}catch(e){fail()}};
const typing=()=>{const a=document.activeElement;return a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&a.id!="q"};
const by=(a,k,r)=>a.slice().sort((x,y)=>r?(y[k]||0)-(x[k]||0):((x[k]||"")<(y[k]||"")?-1:1));
const F=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
const owes=j=>Math.max(0,(j.total||0)-(j.paid||0));
const todayS=()=>iso(Date.now());
function go(t){tab=t;playing=0;document.getElementById("q").value="";draw(1)}
function draw(f){
 if(!f&&(typing()||playing)){pend=1;return}pend=0;
 const td=todayS(),nw=C.inquiries.filter(i=>i.status=="New").length,dr=C.reminders.filter(r=>!r.done&&r.due<=td).length;
 document.getElementById("nav").innerHTML=Object.keys(T).map(k=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${T[k]}${k=="inq"&&nw?`<em style="background:var(--amb)">${nw}</em>`:""}${k=="rem"&&dr?`<em>${dr}</em>`:""}</button>`).join("");
 document.getElementById("ttl").textContent=T[tab];strip();
 const v=document.getElementById("v");
 if(!db){v.innerHTML=`<div class="card">${window.claude?"Loading shared data…":"This page needs to be opened from claude.ai and signed in."}</div>`;return}
 const s=document.getElementById("q").value.toLowerCase();
 v.innerHTML=({home,inq:()=>inq(s),quo:()=>quo(s),jobs:()=>jobs(s),cus:()=>cus(s),rem,play})[tab]()}
document.addEventListener("focusout",()=>{if(pend)setTimeout(()=>{if(!typing())draw()},80)});
const tile=(n,l,c)=>`<div class="st" style="--c:var(--${c})"><b>${n}</b><span>${l}</span></div>`;
function bars(a){const m=Math.max(1,...a.map(x=>x[1]));return a.map(x=>`<div class="bar"><span>${x[0]}</span><div><i style="width:${x[1]/m*100}%"></i></div><b>${x[1]}</b></div>`).join("")}
function home(){
 const td=todayS(),dy=td.slice(0,10),open=C.jobs.filter(j=>j.st<5),late=open.filter(j=>j.dl&&j.dl<dy);
 const bal=C.jobs.reduce((a,j)=>a+owes(j),0),paid=C.jobs.reduce((a,j)=>a+(j.paid||0),0);
 const won=C.inquiries.filter(i=>i.status=="Won").length,conv=C.inquiries.length?Math.round(won/C.inquiries.length*100):0;
 const dr=by(C.reminders.filter(r=>!r.done),"due").slice(0,5),soon=by(open.filter(j=>j.dl),"dl").slice(0,5);
 return `${hit()}<div class="stats">${tile(C.inquiries.filter(i=>i.status=="New").length,"New inquiries","amb")}${tile(C.quotes.filter(q=>q.status=="Sent").length,"Quotes waiting for reply","vio")}${tile(open.length,"Open jobs","ac")}${tile(late.length,"Late jobs","red")}</div>
 <div class="stats">${tile(inr(bal),"Money to collect","red")}${tile(inr(paid),"Money collected","grn")}${tile(conv+"%","Inquiries won","ac")}${tile(C.customers.length,"Clients","vio")}</div>
 <div class="two"><div><div class="card"><h2>Follow-ups</h2>${dr.length?dr.map(r=>`<div class="rem"><div>${esc(r.text)}<div class="mu">${fd(r.due)}${r.who?" · "+esc(r.who):""}</div></div><span class="pill ${r.due<=td?"late":"ok"}">${r.due<=td?"Due now":"Upcoming"}</span></div>`).join(""):'<p class="mu">Nothing pending.</p>'}</div>
 <div class="card"><h2>Next job deadlines</h2>${soon.length?soon.map(j=>`<div class="rem"><div>${esc(j.name)}<div class="mu">${esc(j.prod)} · ${S[j.st]}</div></div><span class="${j.dl<dy?"red":"mu"}">${j.dl}</span></div>`).join(""):'<p class="mu">No deadlines set.</p>'}</div></div>
 <div><div class="card"><h2>Inquiries by source</h2>${bars(SRC.map(x=>[x,C.inquiries.filter(i=>i.src==x).length]))}</div><div class="card"><h2>Jobs by stage</h2>${bars(S.map((x,i)=>[x,C.jobs.filter(j=>j.st==i).length]))}</div></div></div>${ins()}`}
function inqOld(s){
 const L=by(C.inquiries,"at",1).filter(i=>i.name.toLowerCase().includes(s));
 return `<details><summary>+ Add inquiry</summary><form onsubmit="addI(event)"><input name="name" placeholder="Customer name" required><input name="phone" placeholder="Phone"><select name="src">${opt(SRC)}</select><select name="prod">${opt(P)}</select><input name="qty" type="number" min="1" placeholder="Quantity"><input name="text" placeholder="What did they ask?"><button class="a">Save inquiry</button></form></details>
 <div class="card wrap"><table><tr><th>Customer</th><th>Source</th><th>Product</th><th>Qty</th><th>Status</th><th></th></tr>${L.map(i=>`<tr><td><b>${esc(i.name)}</b><div class="mu">${esc(i.phone)} ${esc(i.text)}</div></td><td><span class="pill ${cl(i.src)}">${esc(i.src)}</span></td><td>${esc(i.prod)}</td><td>${esc(i.qty)}</td><td>${sel(IS,i.status,"inquiries",i.id,"status")}</td><td><button class="a" onclick="toQ('${i.id}')">Create quote</button> <button class="g" onclick="remI('${i.id}')">Remind me</button></td></tr>`).join("")}</table>${L.length?"":'<p class="mu">No inquiries yet. Tap + Add inquiry.</p>'}</div>
 <p class="mu">WhatsApp, Instagram and Facebook messages are added by hand for now.</p>`}
function quo(s){
 const L=by(C.quotes,"at",1).filter(q=>q.name.toLowerCase().includes(s));
 return `<details><summary>+ New quote</summary><form onsubmit="addQ(event)"><input name="name" placeholder="Customer name" required><select name="prod">${opt(P)}</select><input name="size" placeholder="Size / details"><input name="qty" type="number" min="1" placeholder="Quantity" required><input name="rate" type="number" min="0" step="0.01" placeholder="Rate per piece (₹)" required><button class="a">Save quote</button></form></details>
 <div class="card wrap"><table><tr><th>Customer</th><th>Product</th><th>Qty</th><th>Rate ₹</th><th>Total</th><th>Status</th><th></th></tr>${L.map(q=>`<tr><td><b>${esc(q.name)}</b><div class="mu">${esc(q.size)}</div></td><td>${esc(q.prod)}</td><td><input type="number" value="${q.qty||0}" onchange="U('quotes','${q.id}',{qty:+this.value})"></td><td><input type="number" step="0.01" value="${q.rate||0}" onchange="U('quotes','${q.id}',{rate:+this.value})"></td><td><b>${inr((q.qty||0)*(q.rate||0))}</b></td><td>${sel(QS,q.status,"quotes",q.id,"status")}</td><td>${q.jobId?'<span class="pill ok">Job created</span>':q.status=="Accepted"?`<button class="a" onclick="mkJ('${q.id}')">Make job</button>`:""}</td></tr>`).join("")}</table>${L.length?"":'<p class="mu">No quotes yet.</p>'}</div>`}
function jobs(s){
 const dy=todayS().slice(0,10);
 return `<div class="board">${S.map((st,i)=>{const L=C.jobs.filter(j=>j.st==i&&j.name.toLowerCase().includes(s));
 return `<div class="col"><h3>${st}<span class="mu">${L.length}</span></h3>${L.map(j=>`<div class="job"><b>${esc(j.name)}</b><div class="mu">${esc(j.prod)} · ${esc(j.qty)} pcs</div>
 <div class="row"><span class="mu">Deadline</span><input type="date" value="${j.dl||""}" onchange="U('jobs','${j.id}',{dl:this.value})"></div>
 ${j.dl&&j.dl<dy&&i<5?'<div class="red">Late</div>':""}
 <div class="row"><span class="mu">Staff</span><input value="${esc(j.who)}" placeholder="Name" onchange="U('jobs','${j.id}',{who:this.value})"></div>
 <div class="row"><span class="mu">Total ₹</span><input type="number" value="${j.total||0}" onchange="U('jobs','${j.id}',{total:+this.value})"></div>
 <div class="mu">Paid ${inr(j.paid)} · <b class="${owes(j)?"red":""}">Balance ${inr(owes(j))}</b></div>
 <div class="row"><input id="p${j.id}" type="number" placeholder="Amount ₹"><button class="g" onclick="pay('${j.id}')">Record payment</button></div>
 ${(j.notes||[]).map(x=>`<div class="note">${esc(x)}</div>`).join("")}
 <div class="row"><input id="n${j.id}" placeholder="Add note"><button class="g" onclick="note('${j.id}')">Add</button></div>
 <div class="row">${i>0?`<button class="g" onclick="U('jobs','${j.id}',{st:${i-1}})">Back</button>`:""}${i<5?`<button class="a" onclick="mvj('${j.id}',${i+1})">Move to ${S[i+1]}</button>`:""}</div></div>`).join("")}</div>`}).join("")}</div>${C.jobs.length?"":'<p class="mu">No jobs yet. Accept a quote, then tap Make job.</p>'}`}
function cus(s){
 const L=by(C.customers,"name").filter(c=>c.name.toLowerCase().includes(s));
 return `<details><summary>+ Add client</summary><form onsubmit="addC(event)"><input name="name" placeholder="Name" required><input name="phone" placeholder="Phone"><input name="biz" placeholder="Business"><input name="addr" placeholder="Address"><button class="a">Save client</button></form></details>
 ${L.map(c=>{const k=c.name.toLowerCase(),js=C.jobs.filter(j=>j.name.toLowerCase()==k),is=C.inquiries.filter(i=>i.name.toLowerCase()==k);
 return `<div class="card"><b>${esc(c.name)}</b> <span class="mu">${esc(c.biz)} ${esc(c.phone)} ${esc(c.addr)}</span><div class="mu">${js.length} jobs · Billed ${inr(js.reduce((a,j)=>a+(j.total||0),0))} · <span class="${js.some(owes)?"red":""}">To collect ${inr(js.reduce((a,j)=>a+owes(j),0))}</span></div>
 <details style="margin:8px 0 0"><summary>History</summary>${js.map(j=>`<div class="note">${esc(j.prod)} · ${esc(j.qty)} pcs · ${S[j.st]} · ${inr(j.total)}</div>`).join("")}${is.map(i=>`<div class="note">Inquiry (${esc(i.src)}): ${esc(i.text)}</div>`).join("")||""}${js.length+is.length?"":'<p class="mu">No history yet.</p>'}</details></div>`}).join("")}${L.length?"":'<p class="mu">No clients yet. They are added automatically from new inquiries and quotes.</p>'}`}
function rem(){
 const td=todayS(),L=by(C.reminders.filter(r=>!r.done),"due");
 return `<details><summary>+ Add task or callback</summary><form onsubmit="addR(event)"><input name="text" placeholder="Example: Call Anitha" required><input name="due" type="datetime-local" required><input name="who" placeholder="Staff name"><button class="a">Save task</button></form></details>
 <div class="card">${L.length?L.map(r=>`<div class="rem"><div><b>${esc(r.text)}</b><div class="mu">${fd(r.due)}${r.who?" · "+esc(r.who):""}</div></div><div class="row"><span class="pill ${r.due<=td?"late":"ok"}">${r.due<=td?"Due now":"Upcoming"}</span><button class="a" onclick="doneR('${r.id}')">Mark done</button></div></div>`).join(""):'<p class="mu">All caught up.</p>'}</div>`}
async function cust(name,phone){const k=name.trim().toLowerCase(),c=C.customers.find(x=>x.name.toLowerCase()==k);if(!c)await A("customers",{name:name.trim(),phone:phone||"",biz:"",addr:""});else if(phone&&!c.phone)U("customers",c.id,{phone})}
async function addIOld(e){const f=F(e);e.target.reset();await cust(f.name,f.phone);await A("inquiries",{...f,qty:+f.qty||0,status:"New"});toast("Inquiry saved")}
async function addQ(e){const f=F(e);e.target.reset();await cust(f.name);await A("quotes",{...f,qty:+f.qty,rate:+f.rate,status:"Draft"});toast("Quote saved")}
async function addC(e){const f=F(e);e.target.reset();await A("customers",f)}
async function addR(e){const f=F(e);e.target.reset();await A("reminders",{...f,done:0});toast("Task saved")}
async function toQ(id){const i=C.inquiries.find(x=>x.id==id);await A("quotes",{name:i.name,prod:i.prod,size:"",qty:i.qty||1,rate:0,status:"Draft"});U("inquiries",id,{status:"Quoted"});xp("quote");go("quo")}
async function remI(id){const i=C.inquiries.find(x=>x.id==id);await A("reminders",{text:"Call "+i.name+" "+(i.phone||""),due:iso(Date.now()+36e5),who:"",done:0});go("rem")}
async function mkJ(id){const q=C.quotes.find(x=>x.id==id),r=await A("jobs",{name:q.name,prod:q.prod,qty:q.qty,st:0,total:(q.qty||0)*(q.rate||0),paid:0,dl:"",who:"",notes:["Quote accepted"+(q.size?": "+q.size:"")]});if(r)await U("quotes",id,{jobId:r.id});xp("job");go("jobs")}
function pay(id){const a=+document.getElementById("p"+id).value;if(!a)return;xp("pay");const j=C.jobs.find(x=>x.id==id);U("jobs",id,{paid:(j.paid||0)+a,notes:[...(j.notes||[]),"Received "+inr(a)+" on "+new Date().toLocaleDateString()]})}
function note(id){const t=document.getElementById("n"+id).value.trim();if(!t)return;const j=C.jobs.find(x=>x.id==id);U("jobs",id,{notes:[...(j.notes||[]),t]})}
let fl="all";
function setF(k){fl=k;draw(1)}
const age=i=>{const d=Math.floor((Date.now()-(i.at||Date.now()))/864e5);return d<1?"Today":d+"d ago"};
function parse(t){

async function imp(inp){

 try{
  const buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:"array",cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
  const have=new Set(C.inquiries.map(i=>i.ext).filter(Boolean)),seen=new Set(C.customers.map(c=>c.name.toLowerCase()));
  const std=["id","leadid","createdtime","date","created","fullname","name","phonenumber","phone","mobile","platform","email","adid","adsetid","formid","isorganic","adname","adsetname","campaignname","formname","campaignid"];
  let add=0,skip=0;toast("Importing leads. Please wait…");

   const g=(...a)=>{for(const k of a)if(m[k]!==""&&m[k]!=null)return String(m[k]).trim();return""};
   const name=g("fullname","name","customername","firstname")||"Meta lead";
   const phone=g("phonenumber","phone","mobile","mobilenumber","whatsapp").replace(/^p:/i,"").replace(/[\s-]/g,"");

   if((!phone&&!g("email"))||have.has(ext)){skip++;continue}
   have.add(ext);
   const city=g("city"),need=g("whatdoyouneedpackagingfor").replace(/_/g," "),pcs=g("howmanypiecesdoyouneed").replace(/_-_/g,"-").replace(/_/g," "),ls=g("leadstatus"),extra=Object.keys(r).filter(k=>!std.includes(nk(k))&&!/^(city|leadstatus|whatdoyouneedpackagingfor|howmanypiecesdoyouneed)$/.test(nk(k))&&String(r[k]).trim()).map(k=>k+": "+r[k]).join(", ");
   const ad=g("campaignname","adname","formname"),text=("Meta ad"+(need?" - "+need:"")+(pcs?", "+pcs+" pcs":"")+(city?", "+city:"")+(ls?". Note: "+ls:"")+(extra?". "+extra:"")+(ad?" ["+ad+"]":"")).slice(0,300);
   const x=parse(text),pl=g("platform").toLowerCase(),t=Date.parse(when),l=ls.toLowerCase(),status=/not? ?int/.test(l)?"Lost":/confirm/.test(l)?"Won":/sent|call|busy|respond|detai|switched|incom/.test(l)?"Contacted":"New";

   await A("inquiries",{name,phone,src:/ig|insta/.test(pl)?"Instagram":"Facebook",prod:x.prod,qty:x.qty,text,status,who:"",ext,...(t?{at:t}:{})});add++}
  toast(add+" new leads added, "+skip+" skipped")
 }catch(e){toast("Could not read that file. Use the Excel or CSV file from your sheet.")}}
